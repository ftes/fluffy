name: Set up toolchain and deps
description: Selects the lane's toolchain and lockfile, installs the toolchain with mise, restores deps and _build, and compiles the deps.

inputs:
  lane:
    description: "oldest (.tool-versions.oldest and mix.lock.oldest) or newest (.tool-versions and mix.lock)"
    required: true
  # Pinned as a workaround for mise.jdx.dev/VERSION racing GitHub release assets. Remove once
  # upstream guarantees that advertised versions are downloadable.
  mise-version:
    description: The mise version to install
    default: "2026.11.12"

outputs:
  elixir:
    value: ${{ steps.toolchain.outputs.elixir }}
  erlang:
    value: ${{ steps.toolchain.outputs.erlang }}
  image:
    value: ${{ steps.toolchain.outputs.image }}
  mix-cache-key:
    value: ${{ steps.mix-cache.outputs.cache-primary-key }}
  mix-cache-hit:
    value: ${{ steps.mix-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Select toolchain
      id: toolchain
      shell: bash
      env:
        TOOLCHAIN_LANE: ${{ inputs.lane }}
      run: |
        if [ "$TOOLCHAIN_LANE" = oldest ]; then
          cp .tool-versions.oldest .tool-versions
          cp mix.lock.oldest mix.lock
        fi
        awk '$1 == "elixir" || $1 == "erlang" { print $1 "=" $2 }' .tool-versions >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
    # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects, up to
    # 24.04, and compiles it from source (~5 min) on newer ones. Drop once mise detects the runner.
    - name: Use precompiled Erlang
      shell: bash
      # The value is the runner's ImageOS digits, nothing a caller or PR controls.
      run: | # zizmor: ignore[github-env]
        if [ -z "${MISE_ERLANG_PRECOMPILED_OS:-}" ] && [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then
          echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"
        fi
    - name: Setup toolchain
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: ${{ inputs.mise-version }}
    # deps and the whole _build (Fluffy too: Mix compares content digests, so a fresh checkout
    # recompiles only what changed, and --warnings-as-errors re-emits the manifest's warnings).
    # Keyed per runner image (PLTs, NIFs and ERTS paths don't carry over) and toolchain. The
    # checks job saves it, on main only; the commit in the key keeps _build current, and the
    # newest save wins the prefix restore.
    - name: Restore deps and _build
      id: mix-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
        restore-keys: |
          mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}-
          mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-
        path: |
          deps
          _build
    - name: Install dependencies
      shell: bash
      run: mix do deps.get + deps.compile
    # deps.get re-resolves, without failing, a dep whose requirement the lock no longer meets.
    - name: Check the oldest lane kept its floors
      if: inputs.lane == 'oldest'
      shell: bash
      run: |
        for dep in phoenix phoenix_live_view; do
          if [ "$(grep "^  \"$dep\":" mix.lock)" != "$(grep "^  \"$dep\":" mix.lock.oldest)" ]; then
            echo "::error::mix deps.get moved $dep off its floor in mix.lock.oldest: raise the floor in mix.exs and mix.lock.oldest together"
            exit 1
          fi
        done
