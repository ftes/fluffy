name: Set up toolchain and deps
description: Selects the lane's toolchain, installs it with mise, restores deps and _build, and compiles the deps.

inputs:
  lane:
    description: "oldest (.tool-versions.oldest) or newest (.tool-versions)"
    required: true

outputs:
  elixir:
    value: ${{ steps.toolchain.outputs.elixir }}
  erlang:
    value: ${{ steps.toolchain.outputs.erlang }}
  image:
    value: ${{ steps.toolchain.outputs.image }}
  mix-cache-key:
    value: ${{ steps.mix-cache.outputs.cache-primary-key }}
  mix-cache-hit:
    value: ${{ steps.mix-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Select toolchain
      id: toolchain
      shell: bash
      env:
        TOOLCHAIN_LANE: ${{ inputs.lane }}
      run: |
        if [ "$TOOLCHAIN_LANE" = oldest ]; then
          cp .tool-versions.oldest .tool-versions
        fi
        awk '$1 == "elixir" || $1 == "erlang" { print $1 "=" $2 }' .tool-versions >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
    - name: Setup toolchain
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        version: ${{ env.MISE_VERSION }}
    # deps and the whole _build (Fluffy too: Mix compares content digests, so a fresh checkout
    # recompiles only what changed, and --warnings-as-errors re-emits the manifest's warnings).
    # Keyed per runner image (PLTs, NIFs and ERTS paths don't carry over) and toolchain. The
    # checks job saves it, on main only; the commit in the key keeps _build current, and the
    # newest save wins the prefix restore.
    - name: Restore deps and _build
      id: mix-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        key: mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
        restore-keys: |
          mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}-
          mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-
        path: |
          deps
          _build
    - name: Install dependencies
      shell: bash
      run: mix do deps.get + deps.compile
