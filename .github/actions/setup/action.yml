name: Set up toolchain and deps
description: Selects the lane's toolchain and lockfile, installs the toolchain with mise, restores deps and _build, and compiles the deps.

inputs:
  lane:
    description: "oldest (.tool-versions.oldest and mix.lock.oldest) or newest (.tool-versions and mix.lock)"
    required: true
  # Pinned as a workaround for mise.jdx.dev/VERSION racing GitHub release assets. Remove once
  # upstream guarantees that advertised versions are downloadable.
  mise-version:
    description: The mise version to install
    default: "2026.11.12"

outputs:
  elixir:
    value: ${{ steps.toolchain.outputs.elixir }}
  erlang:
    value: ${{ steps.toolchain.outputs.erlang }}
  image:
    value: ${{ steps.toolchain.outputs.image }}
  # For Dialyzer PLT keys: Dialyzer rejects a PLT another build of the same Erlang version made
  # (compiled from source vs precompiled), as it stores a hash of its own beams.
  erlang-build:
    value: ${{ steps.erlang-build.outputs.erlang-build }}
  mix-cache-key:
    value: ${{ steps.mix-cache.outputs.cache-primary-key }}
  mix-cache-hit:
    value: ${{ steps.mix-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Select toolchain
      id: toolchain
      shell: bash
      env:
        TOOLCHAIN_LANE: ${{ inputs.lane }}
      run: |
        if [ "$TOOLCHAIN_LANE" = oldest ]; then
          cp .tool-versions.oldest .tool-versions
          cp mix.lock.oldest mix.lock
        fi
        awk '$1 == "elixir" || $1 == "erlang" { print $1 "=" $2 }' .tool-versions >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
    # mise installs precompiled Erlang (builds.hex.pm) only on the Ubuntu runners it detects, up to
    # 24.04, and compiles it from source (~5 min) on newer ones. Drop once mise detects the runner.
    - name: Use precompiled Erlang
      shell: bash
      # The value is the runner's ImageOS digits, nothing a caller or PR controls.
      run: | # zizmor: ignore[github-env]
        if [ -z "${MISE_ERLANG_PRECOMPILED_OS:-}" ] && [[ "${ImageOS:-}" =~ ^ubuntu([0-9]{2})$ ]]; then
          echo "MISE_ERLANG_PRECOMPILED_OS=ubuntu-${BASH_REMATCH[1]}.04" >> "$GITHUB_ENV"
        fi
    - name: Setup toolchain
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        version: ${{ inputs.mise-version }}
    - name: Read the Erlang build
      id: erlang-build
      shell: bash
      run: |
        dialyzer=$(erl -noshell -eval 'io:format("~s", [code:lib_dir(dialyzer)])' -s init stop)
        echo "erlang-build=$(cat "$dialyzer"/ebin/*.beam | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
    # deps and the whole _build (Fluffy too: Mix compares content digests, so a fresh checkout
    # recompiles only what changed, and --warnings-as-errors re-emits the manifest's warnings).
    # Keyed per runner image (PLTs, NIFs and ERTS paths don't carry over) and toolchain, its
    # Erlang build included: _build/test holds Dialyxir's deps PLT, which only fits that build. The
    # checks job saves it, on main only; the commit in the key keeps _build current, and the
    # newest save wins the prefix restore.
    - name: Restore deps and _build
      id: mix-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-${{ steps.erlang-build.outputs.erlang-build }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}
        restore-keys: |
          mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-${{ steps.erlang-build.outputs.erlang-build }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock') }}-
          mix-${{ steps.toolchain.outputs.image }}-erlang-${{ steps.toolchain.outputs.erlang }}-${{ steps.erlang-build.outputs.erlang-build }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ env.MIX_ENV }}-
        path: |
          deps
          _build
    # --check-locked fails when the requirements in mix.exs no longer accept the lane's lock,
    # instead of re-resolving it: the oldest lane then still runs every floor.
    - name: Fetch dependencies
      id: deps-get
      shell: bash
      run: mix deps.get --check-locked
    # On the oldest lane mix.lock is a copy, so Mix's error names the wrong file.
    - name: Explain a stale oldest lock
      if: failure() && steps.deps-get.outcome == 'failure' && inputs.lane == 'oldest'
      shell: bash
      run: echo "::error::mix.lock.oldest no longer meets mix.exs; move a floor in mix.exs and mix.lock.oldest together, see CONTRIBUTING.md"
    - name: Compile dependencies
      shell: bash
      run: mix deps.compile
