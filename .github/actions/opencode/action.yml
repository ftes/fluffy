name: Set up OpenCode
description: Install the pinned OpenCode V2 CLI and exchange GitHub OIDC for model access.
inputs:
  client-id:
    description: Public OpenCode GitHub OIDC client ID
    required: true
outputs:
  token:
    description: Short-lived OpenCode model token
    value: ${{ steps.auth.outputs.token }}
runs:
  using: composite
  steps:
    - name: Check the OIDC client selector
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
      run: |
        if [[ -z "$CLIENT_ID" ]]; then
          echo "::error::Set the OPENCODE_CLIENT_ID repository Actions variable."
          exit 1
        fi
    - shell: bash
      run: npm install --global @opencode/cli@2.4.2
    - id: auth
      uses: ftes/ci/opencode-auth@41939eef91514e8ac6b33a1d6e7923edc42f4628 # v1.0.14
      with:
        client-id: ${{ inputs.client-id }}
