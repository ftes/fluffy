name: Install Playwright browser
description: Installs the Playwright driver, a browser and its system packages, from caches when warm.

inputs:
  browser:
    description: "chromium, firefox or webkit"
    default: chromium
  save-apt-cache:
    description: "Save the system packages' .debs on a miss (one job per run, the others would race)"
    default: "false"

runs:
  using: composite
  steps:
    - name: Get runner image
      id: image
      shell: bash
      run: |
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
    # The driver (with its Node.js) is the same for every browser, so it is cached once.
    - name: Restore Playwright driver
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/playwright_ex
        key: playwright-driver-${{ runner.os }}-${{ hashFiles('deps/playwright_ex/DRIVER_VERSION', 'deps/playwright_ex/NODE_VERSION') }}
    # Browsers depend on the driver version only, not its bundled Node.js.
    - name: Restore Playwright browser
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browser-${{ runner.os }}-${{ hashFiles('deps/playwright_ex/DRIVER_VERSION') }}-${{ inputs.browser }}
    # As in PlaywrightEx's CI: --with-deps runs apt-get against the runner's Azure mirror, which
    # can stall. The .debs are cached per browser and driver version, so a warm run installs
    # offline; archive.ubuntu.com is a fallback mirror, apt times out stalled fetches, and each
    # attempt is capped (a killed attempt's apt-get, out of timeout's reach under sudo, is killed
    # before the next). The key's day makes main save a fresh cache daily, so Ubuntu's package
    # updates are picked up; restores take the newest. autoclean drops the superseded .debs.
    - name: Restore browser system packages
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        key: apt-${{ inputs.browser }}-${{ hashFiles('deps/playwright_ex/DRIVER_VERSION') }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.day }}
        restore-keys: apt-${{ inputs.browser }}-${{ hashFiles('deps/playwright_ex/DRIVER_VERSION') }}-${{ steps.image.outputs.os }}
        path: ~/apt-cache
    - name: Install driver, browser and system packages
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\nDPkg::Lock::Timeout "60";\nAPT::Keep-Downloaded-Packages "true";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then echo "http://archive.ubuntu.com/ubuntu/" | sudo tee -a /etc/apt/apt-mirrors.txt; fi
        if compgen -G ~/apt-cache/'*.deb' > /dev/null; then sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/; fi
        for attempt in 1 2 3; do
          if timeout 300 mix playwright_ex.install -- --with-deps "$BROWSER"; then
            sudo apt-get autoclean -qq
            rm -rf ~/apt-cache && mkdir -p ~/apt-cache && cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
            exit 0
          fi
          echo "::warning::browser install attempt $attempt failed or timed out"
          sudo pkill -x apt-get || true
        done
        exit 1
    - name: Save browser system packages
      if: inputs.save-apt-cache == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
        path: ~/apt-cache
