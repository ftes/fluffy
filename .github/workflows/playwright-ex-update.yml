name: PlaywrightEx Update

# Renovate leaves playwright_ex to this workflow: a new PlaywrightEx member
# fails Fluffy.PlaywrightMembersTest until it is classified.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: playwright-ex-update
  cancel-in-progress: false

permissions: {}

env:
  MIX_ENV: test
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  check:
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      from: ${{ steps.check.outputs.from }}
      release: ${{ steps.check.outputs.release }}
      base-sha: ${{ steps.check.outputs.base-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            mix.lock
            .github/opencode
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Find a newer PlaywrightEx release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/opencode/playwright_update.py check

  update:
    needs: check
    if: needs.check.outputs.mode == 'new' || needs.check.outputs.mode == 'recover'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.base-sha }}
          persist-credentials: false
          fetch-depth: 0
      # Recovery only validates the pushed commit and opens the missing draft.
      # New updates run Mix against code from the owner's PlaywrightEx package.
      - name: Set up toolchain and deps
        if: needs.check.outputs.mode == 'new'
        uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Install Playwright browser
        if: needs.check.outputs.mode == 'new'
        uses: ftes/ci/playwright-browser@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Build test assets and fetch Playwright source
        if: needs.check.outputs.mode == 'new'
        run: |
          mix assets.build
          mix fluffy.playwright_source
      - id: auth
        if: needs.check.outputs.mode == 'new'
        uses: ./.github/actions/opencode
        with:
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      - name: Publish the update as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
          MODE: ${{ needs.check.outputs.mode }}
          PLAYWRIGHT_FROM: ${{ needs.check.outputs.from }}
          PLAYWRIGHT_TO: ${{ needs.check.outputs.release }}
          BASE_SHA: ${{ needs.check.outputs.base-sha }}
        run: python3 -B .github/opencode/playwright_update.py update
