name: PlaywrightEx Update

# Opens a draft PR updating PlaywrightEx to its newest Hex release, as PlaywrightEx's own
# upstream-update.yml does for Playwright. Renovate leaves playwright_ex to this workflow: a new
# PlaywrightEx member fails `Fluffy.PlaywrightMembersTest` until it is classified, which Renovate
# can't do.
#
# This job runs code from a new PlaywrightEx release. PlaywrightEx is the owner's own library.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

# One run at a time and no cancelling: a queued run waits for the update in progress, then finds
# its branch and stops in `check`.
concurrency:
  group: playwright-ex-update
  cancel-in-progress: false

permissions: {}

env:
  MIX_ENV: test

jobs:
  # Is there a newer release without a branch or PR for it?
  check:
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gh pr list (dedup)
    outputs:
      update: ${{ steps.check.outputs.update }}
      from: ${{ steps.check.outputs.from }}
      to: ${{ steps.check.outputs.to }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: mix.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Find a newer PlaywrightEx release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        # Hex's latest_version is the highest release, pre-releases included. A git dep on
        # PlaywrightEx's main waits for a release that contains the locked commit. The branch, or a
        # PR from it, means the release is handled; a dispatch retries one whose PR was closed
        # (delete the branch first).
        run: |
          out() { echo "$1=$2" | tee -a "$GITHUB_OUTPUT"; }
          lock=$(sed -nE 's/^  "playwright": \{:(hex|git), [^,]+, "([^"]+)".*/\1 \2/p' mix.lock)
          read -r kind from <<< "$lock"
          to=$(curl -fsSL --retry 3 https://hex.pm/api/packages/playwright_ex | jq -r .latest_version)
          [[ -n $from && $to =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::cannot read mix.lock or Hex release"; exit 1; }
          out from "$from"
          out to "$to"
          if [[ $kind == hex ]]; then
            newer=$([[ $to != "$from" ]] && echo true || echo false)
          else
            status=$(gh api "repos/ftes/playwright_ex/compare/$from...v$to" --jq .status)
            newer=$([[ $status == ahead || $status == identical ]] && echo true || echo false)
          fi
          branch="opencode/playwright-ex-$to"
          legacy="claude/playwright-ex-$to"
          out branch "$branch"
          states=$([[ $EVENT == workflow_dispatch ]] && echo open || echo all)
          prs=$(gh pr list --head "$branch" --state "$states" --json url --jq '.[].url')
          old_prs=$(gh pr list --head "$legacy" --state "$states" --json url --jq '.[].url')
          if [[ $newer != true ]]; then
            echo "::notice::$to doesn't update the locked $from"
            out update false
          elif [[ -n $prs || -n $old_prs ]]; then
            echo "::notice::PR already exists for $to"
            out update false
          elif gh api "repos/$GH_REPO/git/ref/heads/$branch" --silent 2> /dev/null ||
            gh api "repos/$GH_REPO/git/ref/heads/$legacy" --silent 2> /dev/null; then
            echo "::notice::Branch already exists for $to"
            out update false
          else
            out update true
          fi

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # For `mix check`, as in ci.yml's test job.
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: auth
        uses: ./.github/actions/opencode
      - name: Set up toolchain and deps
        uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      # For the current driver; the agent reinstalls the browser if the update changes it.
      - name: Install Playwright browser
        uses: ftes/ci/playwright-browser@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Build test assets
        run: mix assets.build
      - name: Fetch Playwright source
        run: mix fluffy.playwright_source
      - run: git switch -c "$BRANCH"
      - name: Update and publish a draft
        env:
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
          PLAYWRIGHT_FROM: ${{ needs.check.outputs.from }}
          PLAYWRIGHT_TO: ${{ needs.check.outputs.to }}
        run: python3 .github/opencode/run.py update
