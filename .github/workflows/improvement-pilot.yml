name: Fluffy Improvement Pilot

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: fluffy-improvement-pilot
  cancel-in-progress: false

env:
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  infer:
    if: >-
      github.repository == 'ftes/fluffy' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.actor == github.triggering_actor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proposal: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check maintainer and base
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/opencode/improvement_pilot.py select
      - name: Install pinned OpenCode and Claude Code
        if: steps.select.outputs.eligible == 'true'
        run: | # zizmor: ignore[adhoc-packages] (exact CLI versions, before model authentication)
          npm install --prefix "$RUNNER_TEMP/pilot-tools" --no-audit --no-fund \
            @opencode/cli@2.4.2 @anthropic-ai/claude-code@2.1.332
      - name: Ask Claude Code Sonnet to propose a paragraph or decline
        if: steps.select.outputs.eligible == 'true'
        id: infer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: PATH="$RUNNER_TEMP/pilot-tools/node_modules/.bin:$PATH" python3 -B .github/opencode/improvement_pilot.py infer
      - id: upload
        if: steps.infer.outputs.proposed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: improvement-proposal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: infer
    if: needs.infer.outputs.proposal != ''
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 30
    # GitHub denies cache reads and writes, including those requested by setup actions.
    cache-mode: none
    permissions:
      contents: read
    env:
      MIX_ENV: dev
    outputs:
      checked: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ftes/ci/setup@41939eef91514e8ac6b33a1d6e7923edc42f4628 # v1.0.14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.infer.outputs.proposal }}
          path: ${{ runner.temp }}/pilot-input
      - name: Build the documentation with the exact proposed edit
        run: python3 -B .github/opencode/improvement_pilot.py verify
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: improvement-checked-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: needs.verify.outputs.checked != '' && github.actor == github.triggering_actor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.checked }}
          path: ${{ runner.temp }}/pilot-output
      - name: Open one draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: python3 -B .github/opencode/improvement_pilot.py publish
