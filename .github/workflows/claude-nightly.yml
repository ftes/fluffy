name: Claude Nightly Improvement

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# One run at a time, so two runs can't both take the last slot.
concurrency:
  group: claude-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  # As in ci.yml.
  MISE_VERSION: "2026.8.14"
  MIX_ENV: test

jobs:
  # Frees slots before the cap is counted. A job, not an earlier cron: GitHub delays scheduled
  # runs, and only `needs` guarantees the order.
  triage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Exchanged for the Claude app token, which closes the PRs.
    steps:
      - name: List open nightly PRs without human comments or reviews
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A human comment or review keeps a PR out of triage; Claude's own review doesn't. The
        # allowlist names each PR, so Claude can't close any other.
        run: |
          numbers=$(gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository,comments,reviews \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-")) and ([.comments[], .reviews[]] | all(.author.login == "claude"))) | .number]')
          {
            echo "numbers=$(jq -r 'join(" ")' <<< "$numbers")"
            echo "allowed=$(jq -r 'map("Bash(gh pr close \(.) *)") | join(",")' <<< "$numbers")"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.list.outputs.numbers != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run Claude
        if: steps.list.outputs.numbers != ''
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            OPEN NIGHTLY PRS: ${{ steps.list.outputs.numbers }}

            An earlier nightly run opened these simplification PRs. Close each one that main has
            made obsolete, so its slot can go to new work. main is checked out.

            For each PR, read `gh pr view N`, `gh pr diff N` and the code it touches on main. It is
            obsolete only if the code it simplifies is gone or rewritten, or main already made the
            same change or solved the problem another way. A merge conflict, the PR's age or a
            preference for other work is not a reason. When in doubt, keep it.

            To close one, run exactly:
              gh pr close N --delete-branch --comment "<one sentence naming what on main made it obsolete>"
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Agent,Task,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(gh pr view:*),Bash(gh pr diff:*),${{ steps.list.outputs.allowed }}"

  # After triage, so only PRs worth keeping get fixed.
  conflicts:
    needs: triage
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      numbers: ${{ steps.list.outputs.numbers }}
    steps:
      - name: List conflicted nightly PRs without human comments or reviews
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # GitHub computes mergeability on the first read after main moves, answering UNKNOWN until
        # it's done. A human comment or review keeps a PR from being replaced under them.
        run: |
          list() {
            gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository,mergeable,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-")) and .mergeable == "CONFLICTING" and ([.comments[], .reviews[]] | all(.author.login == "claude"))) | .number]'
          }
          list > /dev/null
          sleep 30
          echo "numbers=$(list)" >> "$GITHUB_OUTPUT"

  # Replaces each conflicted PR with one on a new branch from main. The Claude app can't push
  # workflow file changes, which a merge or rebase of the old branch would carry from main.
  recreate:
    needs: conflicts
    if: ${{ !cancelled() && needs.conflicts.result == 'success' && needs.conflicts.outputs.numbers != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # Exchanged for the Claude app token.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.conflicts.outputs.numbers) }}
    env:
      NIGHTLY_BRANCH: claude/nightly-${{ github.run_id }}-${{ matrix.pr }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up toolchain and deps
        uses: ./.github/actions/setup
        with:
          lane: newest
      - run: git switch -c "$NIGHTLY_BRANCH"
      - name: Run Claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            OLD PR: ${{ matrix.pr }}
            BRANCH: ${{ env.NIGHTLY_BRANCH }} (already checked out, from current main)

            The old PR is a simplification that now conflicts with main. Redo it on this branch.

            Read `gh pr view ${{ matrix.pr }}` and `gh pr diff ${{ matrix.pr }}` for what it set out
            to do, then make the same change against the code as it is now, keeping what main has
            changed since. Run `mix format` and `mix compile --warnings-as-errors`. CI on the new PR
            runs the test suite.

            If the change can't be redone without redesigning it, stop without pushing and say why.

            To publish, commit with the old PR's title as the subject, write tmp/nightly-pr.md (the
            old description, updated if the change differs; tmp/ is gitignored), then run exactly,
            in this order:
              git push -u origin ${{ env.NIGHTLY_BRANCH }}
              gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} --title "<subject>" --body-file tmp/nightly-pr.md
              gh pr close ${{ matrix.pr }} --delete-branch --comment "Conflicted with main; replaced by <new PR URL>."
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix format:*),Bash(mix compile:*),Bash(gh pr view ${{ matrix.pr }}:*),Bash(gh pr diff ${{ matrix.pr }}:*),Bash(git push -u origin ${{ env.NIGHTLY_BRANCH }}),Bash(gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} *),Bash(gh pr close ${{ matrix.pr }} *)"

  # Enforces the cap before any toolchain is set up. Runs even if an earlier job failed: the
  # count is still right, it just finds fewer slots.
  capacity:
    needs: recreate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      has-slot: ${{ steps.count.outputs.has-slot }}
      prs: ${{ steps.count.outputs.prs }}
    steps:
      - name: Count open nightly PRs
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_OPEN_PRS: 3
        # Same-repo branches only: a fork can pick any branch name, and this repo is public.
        run: |
          prs=$(gh pr list --state all --limit 1000 --json title,state,headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("claude/nightly-"))) | {title, state}]')
          open=$(jq '[.[] | select(.state == "OPEN")] | length' <<< "$prs")
          echo "::notice::$open of $MAX_OPEN_PRS nightly PRs open"
          if [ "$open" -lt "$MAX_OPEN_PRS" ]; then has_slot=true; else has_slot=false; fi
          {
            echo "has-slot=$has_slot"
            echo "prs=$(jq -c '.[:30]' <<< "$prs")"
          } >> "$GITHUB_OUTPUT"

  improve:
    needs: capacity
    # !cancelled(): the implicit success() would also fail on any failed or skipped job further up.
    if: ${{ !cancelled() && needs.capacity.outputs.has-slot == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Exchanged for the Claude app token. PRs from GITHUB_TOKEN wouldn't trigger CI.
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      # The run's only branch: the exact push and PR commands below allow no other, and GitHub
      # refuses a second PR for one head, so a run opens at most one.
      NIGHTLY_BRANCH: claude/nightly-${{ github.run_id }}
      # `mix check` outlasts Claude Code's default Bash timeout.
      BASH_DEFAULT_TIMEOUT_MS: "900000"
      BASH_MAX_TIMEOUT_MS: "900000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up toolchain and deps
        uses: ./.github/actions/setup
        with:
          lane: newest
      - name: Install Playwright browser
        uses: ./.github/actions/browser
      - run: pnpm run build:test
      - run: git switch -c "$NIGHTLY_BRANCH"

      - name: Run Claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ env.NIGHTLY_BRANCH }} (already checked out)
            PREVIOUS NIGHTLY PRS, newest first: ${{ needs.capacity.outputs.prs }}

            Find the single most valuable improvement to this codebase's simplicity or consistency
            and open one pull request for it, the kind a senior maintainer would be glad to merge.

            1. Read AGENTS.md and enough of lib/ and test/ to know the prevailing patterns. Use
               subagents to survey separate areas in parallel.
            2. Look for duplicated logic that belongs in one place, dead code, needless indirection
               or options, and one concept handled or named differently across modules or drivers.
            3. Rank the candidates by how much simpler or more uniform the code becomes for how
               little it changes. Read the callers and tests of the best one before committing to
               it. Skip anything overlapping an OPEN PR above or repeating a CLOSED one: those were
               declined.
            4. Implement that one idea, matching the surrounding code. Prefer a diff that removes
               more than it adds.

            Limits: observable public behaviour stays the same, and driver-specific boundaries stay
            explicit. No new features, bug fixes, dependency, CI or changelog changes, and no
            changes that are only formatting, comments or renames to taste.

            Verify with `mix check --max-cases 4`. It must pass. Re-run once if a browser test looks
            flaky; otherwise fix the cause or drop the change.

            If nothing is clearly worth a maintainer's time, or the check can't be made to pass,
            stop without pushing and say why. No PR is a good result; a marginal PR is not.

            To publish, commit with one imperative sentence as the subject (match `git log`), then
            run exactly:
              git push -u origin ${{ env.NIGHTLY_BRANCH }}
              gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} --title "<subject>" --body-file tmp/nightly-pr.md
            Write tmp/nightly-pr.md first (tmp/ is gitignored): a few sentences on what was
            inconsistent or complex and why this is simpler. No attribution lines.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Grep,Glob,Edit,Write,Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(mix check:*),Bash(mix test:*),Bash(mix format:*),Bash(mix compile:*),Bash(mix credo:*),Bash(git push -u origin ${{ env.NIGHTLY_BRANCH }}),Bash(gh pr create --base main --head ${{ env.NIGHTLY_BRANCH }} *)"
