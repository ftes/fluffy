name: PlaywrightEx Update Pilot

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Exact newer PlaywrightEx Hex release (for example, 1.65.0)"
        required: true
        type: string

concurrency:
  group: playwright-ex-pilot
  cancel-in-progress: false

permissions: {}

env:
  BASE_BRANCH: ${{ github.event.repository.default_branch }}
  PLAYWRIGHT_TO: ${{ inputs.release }}

jobs:
  prepare:
    if: github.repository == 'ftes/fluffy' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      previous: ${{ steps.select.outputs.previous }}
      context: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check maintainer, release and branch
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/opencode/playwright_pilot.py select
      - name: Prepare bounded upstream and inventory context
        if: steps.select.outputs.previous != ''
        env:
          PLAYWRIGHT_FROM: ${{ steps.select.outputs.previous }}
        run: python3 -B .github/opencode/playwright_pilot.py context
      - id: upload
        if: steps.select.outputs.previous != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-pilot-context-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context.json
          if-no-files-found: error

  classify:
    needs: prepare
    if: needs.prepare.outputs.context != '' && github.actor == github.triggering_actor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      proposal: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/opencode
          persist-credentials: false
      - name: Install pinned OpenCode and Claude Code
        run: | # zizmor: ignore[adhoc-packages] (exact CLI and native binary versions)
          npm install --prefix "$RUNNER_TEMP/pilot-tools" --no-audit --no-fund \
            @opencode/cli@2.4.2 @anthropic-ai/claude-code@2.1.332
          echo "$RUNNER_TEMP/pilot-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.context }}
          path: ${{ runner.temp }}/pilot-input
      - name: Classify the inventory with Claude Code Sonnet
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -B .github/opencode/playwright_pilot.py classify
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-pilot-proposal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error

  verify:
    needs: [prepare, classify]
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-4-ubuntu-2604' }}
    timeout-minutes: 60
    cache-mode: none
    # This job executes updated dependencies and the proposed inventory.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-timeout 5s
          --health-retries 30
    env:
      MIX_ENV: test
    outputs:
      verified: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Elixir and Erlang
        uses: ftes/ci/setup@41939eef91514e8ac6b33a1d6e7923edc42f4628 # v1.0.14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.classify.outputs.proposal }}
          path: ${{ runner.temp }}/pilot-input
      - name: Prepare and check the proposed update
        env:
          PLAYWRIGHT_FROM: ${{ needs.prepare.outputs.previous }}
        run: python3 -B .github/opencode/playwright_pilot.py verify
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-verified-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified.json
          if-no-files-found: error

  publish:
    needs: verify
    if: github.actor == github.triggering_actor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The App token triggers the ordinary PR CI. Only trusted Python and Git run in this job.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    env:
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish the verified files as a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verify.outputs.verified }}
        run: python3 -B .github/opencode/playwright_pilot.py publish
