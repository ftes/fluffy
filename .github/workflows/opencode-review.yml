name: OpenCode Review

# This workflow can come from the PR. Its run name is only a routing hint for
# the default-branch workflow; it never checks out code or uses credentials.
run-name: >-
  ${{ (github.event.action != 'edited' || github.event.changes.base.ref.from != null) &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' ||
        contains(fromJSON('["claude[bot]","opencode-agent[bot]"]'), github.event.pull_request.user.login)) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      format('Review {0} {1}', github.event.pull_request.number, github.event.action) || 'Skip automatic review' }}

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, edited]

permissions: {}

jobs:
  request:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base.ref.from != null) &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' ||
        contains(fromJSON('["claude[bot]","opencode-agent[bot]"]'), github.event.pull_request.user.login)) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: 'true'
