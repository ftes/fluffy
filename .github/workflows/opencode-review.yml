name: OpenCode Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, edited]

permissions: {}

env:
  MIX_ENV: test

jobs:
  review:
    # Same-repo setup code runs in this job; no fork or Renovate branch gets OIDC access.
    if: >-
      (github.event.action != 'edited' || github.event.changes.base.ref.from != null) &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' ||
        contains(fromJSON('["claude[bot]","opencode-agent[bot]"]'), github.event.pull_request.user.login)) &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      # Let a publisher finish its post-submit snapshot check. The next job also
      # reconciles stale verdicts before any step that requires model access.
      cancel-in-progress: false
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      NUMBER: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      RETARGETED: ${{ github.event.action == 'edited' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Save the runner before switching to the PR head
        run: cp -R .github/opencode "$RUNNER_TEMP/fluffy-opencode"
      - name: Dismiss superseded verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/fluffy-opencode/run.py" reconcile-reviews
      - id: auth
        uses: ./.github/actions/opencode
        with:
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      - name: Switch to the reviewed commit
        run: git switch --detach "$HEAD"
      - name: Set up toolchain and deps
        continue-on-error: true
        uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Fetch Playwright source
        continue-on-error: true
        run: mix fluffy.playwright_source
      - name: Review and publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
        run: python3 "$RUNNER_TEMP/fluffy-opencode/run.py" review
