name: OpenCode Commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

env:
  MIX_ENV: test
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  gate:
    # The runner validates the exact command, author, current permission and PR target.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      (contains(github.event.comment.body || github.event.review.body || github.event.issue.body || '', '/agent') ||
        (github.event_name == 'issues' && contains(github.event.issue.title, '/agent')))
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      fork: ${{ steps.gate.outputs.fork }}
      pr: ${{ steps.gate.outputs.pr }}
      number: ${{ steps.gate.outputs.number }}
      branch: ${{ steps.gate.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/opencode/command.py gate

  reply:
    needs: gate
    if: needs.gate.outputs.fork == 'true'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.number }}
          BODY: "`/agent` runs only on pull requests from this repository."
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"

  command:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 60
    concurrency:
      group: claude-${{ needs.gate.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - run: cp -R .github/opencode "$RUNNER_TEMP/fluffy-opencode"
      - id: auth
        uses: ./.github/actions/opencode
        with:
          client-id: ${{ vars.OPENCODE_CLIENT_ID }}
      - name: Switch to the authorized worktree
        env:
          IS_PR: ${{ needs.gate.outputs.pr }}
          BRANCH: ${{ needs.gate.outputs.branch }}
        run: |
          if [[ "$IS_PR" == true ]]; then
            git switch --detach "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi
      - name: Set up toolchain and deps
        continue-on-error: true
        uses: ftes/ci/setup@41939eef91514e8ac6b33a1d6e7923edc42f4628 # v1.0.14
      - name: Fetch Playwright source
        continue-on-error: true
        run: mix fluffy.playwright_source
      - name: Run command and publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
          BRANCH: ${{ needs.gate.outputs.branch }}
        run: python3 "$RUNNER_TEMP/fluffy-opencode/command.py" command
