name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  # As in ci.yml.
  MISE_VERSION: "2026.8.14"
  MIX_ENV: test

jobs:
  claude:
    # Only for the repo's owner, members and collaborators, so others' mentions don't spend a setup.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    # The image main saves setup's deps cache from.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up toolchain and deps
        uses: ./.github/actions/setup
        with:
          lane: newest
      - name: Fetch Playwright source
        run: mix fluffy.playwright_source
      # The action checks out a PR's head, and mix evaluates its mix.exs: on a fork's PR, with this
      # job's secrets, Claude gets no mix commands. deps.get is for a PR that changes mix.lock.
      - name: Choose Claude's tools
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
        run: |
          tools="Read,Grep,Glob,Agent,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
          fork=false
          if [ -n "$PR" ]; then
            fork=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          fi
          if [ "$fork" != true ]; then
            tools="$tools,Bash(mix deps.get:*),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*)"
          fi
          echo "allowed=$tools" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Tag mode adds its own tools (comment, CI, commit) and allows edits inside the checkout. A
          # prompt input would switch to agent mode, so the context goes in the system prompt.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --append-system-prompt "Dependency code is in deps/ at the versions mix.lock pins, with docs from mix usage_rules.docs, and the pinned Playwright version's source is in tmp/playwright-<version>/. Both are gitignored, so Grep searches them only when given their path."
            --allowedTools "${{ steps.tools.outputs.allowed }}"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # Only the final message and each denied call's command, path or URL: this repo is public,
        # and the full transcript can contain secrets.
        run: |
          jq -r '.[] | select(.type == "result")
            | (.result // .subtype),
              (.permission_denials // [] | select(length > 0) | "\n**Denied tool calls (\(length)):**\n",
                (.[] | (.tool_input | .command // .file_path // .path // .pattern // .url // "" | gsub("\\s+"; " ") | .[:200]) as $arg
                  | "- \(.tool_name)" + (if $arg == "" then "" else ": `` \($arg) ``" end)))' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
