name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # As in ci.yml.
  MISE_VERSION: "2026.8.14"
  MIX_ENV: test
  # Steers Claude off the Bash habits (cd, pipes, heredocs) that miss the allowlist. Plain text
  # only (no quotes, $ or backslashes): claude.yml passes it in a quoted claude_args argument.
  TOOL_HINT: "Prefer your file tools over Bash to read, search and edit files, and keep any scratch files under tmp/; run each allowed Bash command on its own, without cd, semicolons, &&, pipes or heredocs (you are already in the repository). Give any subagent you start these same rules."

jobs:
  claude-review:
    # Claude's own PRs are the only bot PRs reviewed, and fork PRs get no secrets.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'claude[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The image main saves setup's deps cache from.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Setup and the dev/ task compile the PR: a PR that doesn't build still gets a Claude run.
      - name: Set up toolchain and deps
        continue-on-error: true
        uses: ./.github/actions/setup
        with:
          lane: newest
      - name: Fetch Playwright source
        continue-on-error: true
        run: mix fluffy.playwright_source

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot]
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}

            Review this pull request like a senior maintainer of this codebase. The PR is checked
            out; read whatever you need.

            ${{ env.TOOL_HINT }}

            1. Read AGENTS.md / CLAUDE.md (and the files they reference) for the project's rules.
               Read the PR description (`gh pr view PR`) and the diff (`git diff BASE...HEAD`).
            2. For every changed file, read the surrounding code, the callers and the tests, not
               just the hunks. A bug is usually in how the change meets existing code.
            3. Look for real defects: wrong behaviour, unhandled cases, broken invariants,
               authorization or data-exposure holes, races, data loss in migrations, tests that
               don't test what they claim, and violations of the project's written rules. Use
               subagents to review large or separate areas in parallel.
            4. Verify each candidate before reporting: trace the code path and state the concrete
               input or scenario that fails. Drop anything you cannot substantiate, and skip
               style, naming and formatting nits.
            5. Don't repeat findings already posted on this PR
               (`gh api repos/REPO/pulls/PR/comments`, `gh pr view PR --comments`).

            Post each verified finding as an inline comment on the relevant line
            (mcp__github_inline_comment__create_inline_comment, confirmed: true), with the failure
            scenario and a suggested fix. Then post or update one summary comment with
            `gh pr comment PR --edit-last --create-if-none --body-file <file>`: a few sentences on
            what you checked and the most important findings, or why you found nothing.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Agent,Task,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),mcp__github_inline_comment__create_inline_comment"
      - name: Summarize Claude's result
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        # .github/claude-summary.jq: only the final message and the denied calls (public repo). From
        # the run's commit, as Claude may have edited the checkout; a failed `git show` stops the step.
        run: |
          filter=$(git show "$GITHUB_SHA:.github/claude-summary.jq")
          jq -r "$filter" "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY"
