name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  # Runs subagents in the foreground. A headless run ends with Claude's turn, which drops any
  # still running in the background: the review ended waiting on its reviewers and posted nothing.
  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

jobs:
  claude-review:
    # Claude's own PRs are the only bot PRs reviewed, and only this repository's PRs, never
    # Renovate's branches, whoever opened the PR.
    if: >-
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate/') &&
      (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'claude[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The image main saves setup's deps cache from.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The Claude action from main, not from the checkout above: into tmp/, which is gitignored.
      - name: Checkout main's actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: tmp/ci
          sparse-checkout: |
            .github/actions
            .github/scripts
          persist-credentials: false
      # A rebase of reviewed changes skips the rest; a later push can be reviewed by its increment.
      # Should it fail, Claude reviews it all.
      - name: Compare with the last review
        id: increment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/claude-review-increment.sh
      # The comments, reviews and review comments of maintainers and claude[bot], for the prompt;
      # Claude's tools can't read comments. Should it fail, so does the job: no review without them.
      - name: Collect maintainers' comments
        if: steps.increment.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash tmp/ci/.github/scripts/claude-review-comments.sh
      # Setup and the dev/ task compile the PR: a PR that doesn't build still gets a Claude run.
      - name: Set up toolchain and deps
        if: steps.increment.outputs.mode != 'skip'
        continue-on-error: true
        uses: ./.github/actions/setup
        with:
          lane: newest
      - name: Fetch Playwright source
        if: steps.increment.outputs.mode != 'skip'
        continue-on-error: true
        run: mix fluffy.playwright_source

      - name: Run Claude Code Review
        if: steps.increment.outputs.mode != 'skip'
        uses: ./tmp/ci/.github/actions/claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude[bot]
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.base_ref }}
            LAST REVIEW: ${{ steps.increment.outputs.note }}

            Review this pull request like a senior maintainer of this codebase. The PR is checked
            out; read whatever you need.

            First pick the depth. With an earlier review, tmp/claude-review/increment.diff has what
            changed since. Review just the increment, and how it meets the rest of the PR, when it
            refines the PR within its design: fixes, follow-ups to findings, local changes. Review
            the whole PR when the increment changes its shape: new areas, a changed public API or
            behaviour, a different approach, or much of the PR rewritten. Read the whole diff
            either way. The steps below apply to what you review.

            1. Read AGENTS.md / CLAUDE.md (and the files they reference) for the project's rules.
               Read the PR description (`gh pr view PR`) and the diff (`git diff BASE...HEAD`).
            2. For every changed file, read the surrounding code, the callers and the tests, not
               just the hunks. A bug is usually in how the change meets existing code.
            3. Look for real defects: wrong behaviour, unhandled cases, broken invariants,
               authorization or data-exposure holes, races, data loss in migrations, tests that
               don't test what they claim, and violations of the project's written rules. Use
               subagents to review large or separate areas in parallel.
               Also review simplicity, consistency and scope, following the Reviewing guidance
               AGENTS.md gives or links: point at the existing code a change duplicates or
               departs from, or at the issue it goes beyond. A change users can see needs a
               CHANGELOG.md entry and an internal one none, as AGENTS.md says.
            4. Verify each candidate before reporting: trace the code path and state the concrete
               input or scenario that fails. Drop anything you cannot substantiate, and skip
               style, naming and formatting nits.
               Don't ask for handling of edge cases outside the PR's issue; list them in the
               summary as follow-ups.
               CI runs `mix format --check-formatted`, credo, `mix compile --warnings-as-errors`, dialyzer, the
               docs build and the tests. Do not run or approximate them, and do not comment on what they cover.
               Review what CI cannot catch: correctness, design and docs.
            5. Don't repeat findings already posted on this PR: tmp/claude-review/comments.md has
               its comments, reviews and review comments by maintainers and Claude.

            Post each verified finding as an inline comment on the relevant line
            (mcp__github_inline_comment__create_inline_comment, confirmed: true), with the failure
            scenario and a suggested fix. Then post one new summary comment per review run with
            `gh pr comment PR --body-file <file>`: a few sentences on what you checked and the
            most important findings, or why you found nothing. Say which depth you chose and why.
            After an increment review, cover what changed since the last review and say in a line
            whether the earlier findings still hold, without repeating the earlier summary. End
            the comment with this line, verbatim:
            <!-- claude-review: ${{ steps.increment.outputs.head }} ${{ steps.increment.outputs.fork }} -->
          claude_args: |
            --max-turns 80
            --allowedTools "Skill,Read,Grep,Glob,Agent,Task,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view ${{ github.event.pull_request.number }}),Bash(gh pr view ${{ github.event.pull_request.number }} *),Bash(gh pr diff ${{ github.event.pull_request.number }}),Bash(gh pr diff ${{ github.event.pull_request.number }} *),Bash(gh pr comment ${{ github.event.pull_request.number }} *),Bash(mix usage_rules.docs:*),Bash(mix usage_rules.search_docs:*),mcp__github_inline_comment__create_inline_comment"
