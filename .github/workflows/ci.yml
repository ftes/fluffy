name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its running CI. Other events (main pushes, dispatches) get a group of
# their own, so a main push is not cancelled before its cache save.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Temporary workaround for mise.jdx.dev/VERSION racing GitHub release assets.
  # Remove once upstream guarantees that advertised versions are downloadable.
  MISE_VERSION: "2026.8.14"
  MIX_ENV: test

jobs:
  # Compile, lint and docs per lane; the newest lane also checks formatting and Dialyzer. No
  # browser or database. Saves the deps and _build cache on main.
  checks:
    name: checks (${{ matrix.lane }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [oldest, newest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up toolchain and deps
        id: setup
        uses: ./.github/actions/setup
        with:
          lane: ${{ matrix.lane }}
      # After the deps and _build restore, so a fresher PLT wins.
      - name: Restore Dialyzer PLTs
        if: matrix.lane == 'newest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.mix/dialyxir*.plt*
            _build/test/dialyxir*.plt*
          key: dialyzer-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-elixir-${{ steps.setup.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            dialyzer-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-elixir-${{ steps.setup.outputs.elixir }}-
      - name: Check formatting
        if: matrix.lane == 'newest'
        run: mix format --check-formatted
      - name: Compile and lint
        run: |
          mix compile --warnings-as-errors
          mix credo --format oneline
      - name: Run Dialyzer
        if: matrix.lane == 'newest'
        run: mix dialyzer --format short --list-unused-filters
      - name: Build documentation without warnings
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors
      # Last, so only a green job saves; under the key computed before deps.get. On main only: a
      # PR restores main's cache but never writes the shared one.
      - name: Save deps and _build
        if: success() && github.ref == 'refs/heads/main' && steps.setup.outputs.mix-cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.setup.outputs.mix-cache-key }}
          path: |
            deps
            _build

  # Each lane's suite in `partitions` jobs (`mix test --partitions`: test files round-robin by
  # sorted path). Each job has its own Postgres, browser and FLUFFY_ARTIFACT_DIR.
  test:
    name: test (${{ matrix.lane }}, ${{ matrix.partition }}/${{ matrix.partitions }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [oldest, newest]
        # `partition` lists 1..partitions.
        partitions: [3]
        partition: [1, 2, 3]
    services:
      postgres:
        image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # A short interval: the first check runs one interval after start, and the runner waits for it.
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      FLUFFY_ARTIFACT_DIR: tmp/fluffy-artifacts
      FLUFFY_BROWSER: chromium
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      TEST_PARTITIONS: ${{ matrix.partitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up toolchain and deps
        id: setup
        uses: ./.github/actions/setup
        with:
          lane: ${{ matrix.lane }}
      - name: Install Playwright browser
        uses: ./.github/actions/browser
        with:
          save-apt-cache: ${{ matrix.lane == 'newest' && matrix.partition == 1 }}
      # build:test's npm deps, not left to the browser action, whose driver install needn't be npm.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:test
      # The retry reruns this partition's files with the same seed.
      - name: Run tests with one retry
        id: tests
        run: |
          fluffy_test_seed=$RANDOM
          if FLUFFY_ARTIFACT_DIR="$FLUFFY_ARTIFACT_DIR/first" mix test --warnings-as-errors --max-cases 4 --seed "$fluffy_test_seed" --partitions "$TEST_PARTITIONS"; then
            exit 0
          fi

          echo "retried=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Tests failed; retrying once with seed $fluffy_test_seed. Both attempts' failure artifacts will be uploaded."
          FLUFFY_ARTIFACT_DIR="$FLUFFY_ARTIFACT_DIR/retry" mix test --warnings-as-errors --max-cases 4 --seed "$fluffy_test_seed" --partitions "$TEST_PARTITIONS"
      - name: Upload browser failure artifacts
        if: failure() || steps.tests.outputs.retried == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failures-${{ matrix.lane }}-${{ matrix.partition }}of${{ matrix.partitions }}-elixir-${{ steps.setup.outputs.elixir }}-erlang-${{ steps.setup.outputs.erlang }}
          path: tmp/fluffy-artifacts
          if-no-files-found: ignore

  consumer:
    name: consumer fixture
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      FLUFFY_ARTIFACT_DIR: tmp/fluffy-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up toolchain and deps
        id: setup
        uses: ./.github/actions/setup
        with:
          lane: newest
      - name: Install Playwright browser
        uses: ./.github/actions/browser
      # Per commit, as the main deps and _build: the fixture compiles Fluffy as a path dep.
      - name: Restore consumer deps and _build
        id: consumer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: consumer-mix-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-elixir-${{ steps.setup.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('integration/consumer/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            consumer-mix-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-elixir-${{ steps.setup.outputs.elixir }}-${{ env.MIX_ENV }}-${{ hashFiles('integration/consumer/mix.lock') }}-
            consumer-mix-${{ steps.setup.outputs.image }}-erlang-${{ steps.setup.outputs.erlang }}-elixir-${{ steps.setup.outputs.elixir }}-${{ env.MIX_ENV }}-
          path: |
            integration/consumer/deps
            integration/consumer/_build
      - name: Verify external consumer fixture
        working-directory: integration/consumer
        run: |
          mix deps.get
          mix test
      - name: Save consumer deps and _build
        if: success() && github.ref == 'refs/heads/main' && steps.consumer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.consumer-cache.outputs.cache-primary-key }}
          path: |
            integration/consumer/deps
            integration/consumer/_build

  # The required status checks are `quality (oldest)` and `quality (newest)`, the names of the
  # jobs before the split. Each is green when every job above is.
  quality:
    name: quality (${{ matrix.lane }})
    if: always()
    needs: [checks, test, consumer]
    runs-on: ubuntu-slim
    strategy:
      matrix:
        lane: [oldest, newest]
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job finished with: $result"
              exit 1
            fi
          done
