name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Temporary workaround for mise.jdx.dev/VERSION racing GitHub release assets.
  # Remove once upstream guarantees that advertised versions are downloadable.
  MISE_VERSION: "2026.8.14"

jobs:
  quality:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        lane: [oldest, newest]
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLUFFY_ARTIFACT_DIR: tmp/fluffy-artifacts
      FLUFFY_BROWSER: chromium
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select toolchain
        id: toolchain
        env:
          TOOLCHAIN_LANE: ${{ matrix.lane }}
        run: |
          if [ "$TOOLCHAIN_LANE" = oldest ]; then
            cp .tool-versions.oldest .tool-versions
            # Keep Corepack and mise on the same pnpm version for this lane.
            pnpm_version=$(awk '$1 == "pnpm" { print $2 }' .tool-versions)
            jq --arg version "pnpm@$pnpm_version" '.packageManager = $version' package.json > package.json.tmp
            mv package.json.tmp package.json
          fi
          awk '$1 == "elixir" || $1 == "erlang" { print $1 "=" $2 }' .tool-versions >> "$GITHUB_OUTPUT"
      - name: Setup toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
      - name: Restore Dialyzer PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.mix/dialyxir*.plt*
            _build/test/dialyxir*.plt*
          key: dialyzer-${{ runner.os }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            dialyzer-${{ runner.os }}-erlang-${{ steps.toolchain.outputs.erlang }}-elixir-${{ steps.toolchain.outputs.elixir }}-
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium
      - run: mix deps.get
      - run: pnpm install --frozen-lockfile
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run build:test
      - run: mix lint
      - name: Run tests with one retry
        id: tests
        run: |
          fluffy_test_seed=$RANDOM
          if FLUFFY_ARTIFACT_DIR="$FLUFFY_ARTIFACT_DIR/first" mix test --warnings-as-errors --max-cases 4 --seed "$fluffy_test_seed"; then
            exit 0
          fi

          echo "retried=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Tests failed; retrying once with seed $fluffy_test_seed. Both attempts' failure artifacts will be uploaded."
          FLUFFY_ARTIFACT_DIR="$FLUFFY_ARTIFACT_DIR/retry" mix test --warnings-as-errors --max-cases 4 --seed "$fluffy_test_seed"
      - run: mix dialyzer --format short --list-unused-filters
      - name: Build documentation without warnings
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors
      - name: Verify external consumer fixture
        if: matrix.lane == 'newest'
        working-directory: integration/consumer
        run: |
          mix deps.get
          mix test
      - name: Upload browser failure artifacts
        if: failure() || steps.tests.outputs.retried == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failures-${{ matrix.lane }}-elixir-${{ steps.toolchain.outputs.elixir }}-erlang-${{ steps.toolchain.outputs.erlang }}
          path: tmp/fluffy-artifacts
          if-no-files-found: ignore
