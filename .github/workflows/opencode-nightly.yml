name: OpenCode Nightly Improvement

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# One run at a time, so two runs can't both take the last slot.
concurrency:
  group: claude-nightly
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

env:
  MIX_ENV: test
  MAX_COMMITS: 3

jobs:
  # Frees slots before the cap is counted. A job, not an earlier cron: GitHub delays scheduled
  # runs, and only `needs` guarantees the order.
  triage:
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      redo: ${{ steps.redo.outputs.redo }}
    steps:
      - name: List open nightly PRs without human comments or reviews
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A human comment or review keeps a PR out of triage.
        run: |
          numbers=$(gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository,comments,reviews \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | test("^(claude|opencode)/nightly-")) and ([.comments[], .reviews[]] | all(.author.login | IN("claude", "opencode-agent", "coderabbitai")))) | .number] | join(" ")')
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: steps.list.outputs.numbers != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: auth
        if: steps.list.outputs.numbers != ''
        uses: ./.github/actions/opencode
      - name: Triage nightly PRs
        id: redo
        if: steps.list.outputs.numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
          NUMBERS: ${{ steps.list.outputs.numbers }}
        run: python3 .github/opencode/run.py triage

  # After triage, so only PRs worth keeping are looked at. A PR with a human comment or review is
  # left to that human.
  classify:
    needs: triage
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      contents: write # Deletes the branch of a PR given up on.
      pull-requests: write # Closes that PR.
      # Read by statusCheckRollup.
      actions: read
      checks: read
      statuses: read
    outputs:
      recreate: ${{ steps.list.outputs.recreate }}
      work: ${{ steps.work.outputs.work }}
    steps:
      - name: Sort open nightly PRs without human comments or reviews by what they need
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Triage's PRs to redo on current main; none if it failed.
          REDO: ${{ needs.triage.outputs.redo || '[]' }}
        # GitHub computes mergeability on the first read after main moves, answering UNKNOWN until
        # it's done. A PR lists every run of a check, so only each check's latest counts. A fix
        # adds a commit, so the commit count limits the attempts. Listing commits caps --limit at
        # 40: more exceeds GitHub's GraphQL node limit. A PR to recreate (conflicted, or triage's
        # redo) isn't fixed as well: its replacement gets a CI run of its own. A PR out of fixes is
        # given up on, not redone, which would reset its fix budget.
        # A conflicting PR is recreated even if it is a redo: each conflict follows a change on main,
        # and the app can't push a merge or rebase, so the cap on redos is triage's alone.
        run: |
          list() {
            gh pr list --state open --limit 40 --json number,headRefName,isCrossRepository,mergeable,commits,statusCheckRollup,comments,reviews \
              --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | test("^(claude|opencode)/nightly-")) and ([.comments[], .reviews[]] | all(.author.login | IN("claude", "opencode-agent", "coderabbitai")))) | {number, branch: .headRefName, mergeable, commits: (.commits | length), failing: ([.statusCheckRollup[] | select(.workflowName == "CI")] | group_by(.name) | map(max_by(.startedAt)) | any(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT"))}]'
          }
          list > /dev/null
          sleep 30
          prs=$(list)
          exhausted=$(jq -c --argjson max "$MAX_COMMITS" 'map(select(.mergeable == "MERGEABLE" and .failing and .commits >= $max) | .number)' <<< "$prs")
          # Triage's redo, if still open and listed (triage may have closed it, or a human commented
          # since), not out of fixes and not a redo itself.
          recreate=$(jq -c --argjson redo "$REDO" --argjson exhausted "$exhausted" '. as $prs
            | ($redo | map(select(.number as $n | ($prs | any(.number == $n and (.branch | test("^(claude|opencode)/nightly-[0-9]+-[0-9]+$") | not))) and ($exhausted | all(. != $n)))))
              + map(select(.mergeable == "CONFLICTING") | {number, why: "It conflicts with main."})
            | unique_by(.number)' <<< "$prs")
          others=$(jq -c --argjson recreate "$recreate" 'map(select(.number as $n | $recreate | all(.number != $n)))' <<< "$prs")
          mergeable=$(jq -c 'map(select(.mergeable == "MERGEABLE"))' <<< "$others")
          # Listing retries earlier resolutions without another commit. Only new fixes use the budget.
          candidates=$(jq -c --argjson max "$MAX_COMMITS" 'map(select(.commits < $max) | {number, branch, failing})' <<< "$mergeable")
          {
            echo "recreate=$recreate"
            echo "candidates=$candidates"
            echo "review-prs=$(jq -r 'map(.number) | join(" ")' <<< "$mergeable")"
            echo "exhausted=$(jq -r 'join(" ")' <<< "$exhausted")"
          } >> "$GITHUB_OUTPUT"
      # Findings the review bots left unresolved, which a ruleset requiring
      # resolved conversations blocks the merge on. Should it fail, only CI failures get fixed.
      - name: List open review findings
        id: threads
        if: steps.list.outputs.review-prs != ''
        continue-on-error: true
        uses: ftes/ci/review-threads@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
        with:
          prs: ${{ steps.list.outputs.review-prs }}
          authors: claude opencode-agent coderabbitai
      - name: Pick the PRs to fix
        id: work
        env:
          CANDIDATES: ${{ steps.list.outputs.candidates || '[]' }}
          OPEN: ${{ steps.threads.outputs.open || '[]' }}
        run: echo "work=$(jq -cn --argjson open "$OPEN" 'env.CANDIDATES | fromjson | map(select(.failing or (.number as $n | $open | any(. == $n))))')" >> "$GITHUB_OUTPUT"
      - name: Close PRs still failing after two fixes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.list.outputs.exhausted }}
        run: |
          for number in $NUMBERS; do
            gh pr close "$number" --delete-branch --comment "CI still fails after two automatic fixes."
          done

  # Pushes a fix to each PR whose CI failed, which is where a change gets tested: improve publishes
  # without running the suite, or that has open review findings, which it then answers. Only new
  # commits, nothing merged from main, so no workflow files. Postgres and Chromium let OpenCode rerun
  # the failed tests.
  fix:
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.work != '[]' }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # gh run view, for the failed log.
      id-token: write
      pull-requests: write # Answers the review findings.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.work) }}
    # As in ci.yml's test job.
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: cp -R .github/opencode "$RUNNER_TEMP/fluffy-opencode"
      - id: auth
        uses: ./.github/actions/opencode
      - name: Check out the nightly PR branch
        env:
          BRANCH: ${{ matrix.pr.branch }}
        run: git switch --detach "origin/$BRANCH"
      - name: Set up toolchain and deps
        uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      # These may fail on a branch that doesn't compile; the agent then runs without them.
      - name: Install Playwright browser
        continue-on-error: true
        uses: ftes/ci/playwright-browser@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Build test assets
        continue-on-error: true
        run: mix assets.build
      - name: Fetch Playwright source
        continue-on-error: true
        run: mix fluffy.playwright_source
      - name: Save the failed CI log
        if: matrix.pr.failing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.pr.branch }}
        run: |
          # This repository's runs of the checked-out commit only.
          head=$(git rev-parse HEAD)
          # shellcheck disable=SC2016 # jq's $ENV
          run=$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" -f branch="$BRANCH" -f head_sha="$head" -f event=pull_request -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_repository.full_name == $ENV.GH_REPO)][0].id // empty')
          if [[ -z $run ]]; then echo "::error::No CI run of $BRANCH at $head."; exit 1; fi
          mkdir -p tmp
          gh run view "$run" --log-failed | tail -n 5000 > tmp/ci-failed.log
      # Should it fail, only fix CI.
      - name: List open review findings
        id: threads
        continue-on-error: true
        uses: ftes/ci/review-threads@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
        with:
          prs: ${{ matrix.pr.number }}
          authors: claude opencode-agent coderabbitai
      - name: Fix and publish
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
          NUMBER: ${{ matrix.pr.number }}
          BRANCH: ${{ matrix.pr.branch }}
          FAILING: ${{ matrix.pr.failing }}
        run: python3 "$RUNNER_TEMP/fluffy-opencode/run.py" fix
      # Replies to each finding; reacts to and resolves the fixed ones.
      - name: Answer the review findings
        if: steps.repair.outputs.answers != ''
        uses: ftes/ci/review-threads/answer@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
        with:
          pr: ${{ matrix.pr.number }}
          answers: ${{ steps.repair.outputs.answers }}

  # Replaces each conflicted PR, and each that triage found no longer fits main, with one on a new
  # branch from main. Automation can't push workflow file changes, which a merge or rebase of
  # the old branch would carry from main.
  recreate:
    needs: classify
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.recreate != '[]' }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.classify.outputs.recreate) }}
    env:
      BRANCH: opencode/nightly-${{ github.run_id }}-${{ matrix.pr.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: auth
        uses: ./.github/actions/opencode
      - name: Set up toolchain and deps
        uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Fetch Playwright source
        run: mix fluffy.playwright_source
      - run: git switch -c "$BRANCH"
      - name: Recreate and publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
          NUMBER: ${{ matrix.pr.number }}
          REDO_WHY: ${{ matrix.pr.why }}
        run: python3 .github/opencode/run.py recreate

  # Enforces the cap before any toolchain is set up. Runs even if an earlier job failed: the
  # count is still right, it just finds fewer slots.
  capacity:
    needs: [fix, recreate]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      has-slot: ${{ steps.count.outputs.has-slot }}
      prs: ${{ steps.count.outputs.prs }}
    steps:
      - name: Count open nightly PRs
        id: count
        # pipefail, for the bots' lookup below.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_OPEN_PRS: 3
        # Same-repo branches only: a fork can pick any branch name, and this repo is public.
        run: |
          prs=$(gh pr list --state all --limit 1000 --json number,title,state,headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | test("^(claude|opencode)/nightly-"))) | {number, title, state}]')
          open=$(jq '[.[] | select(.state == "OPEN")] | length' <<< "$prs")
          echo "::notice::$open of $MAX_OPEN_PRS nightly PRs open"
          if [ "$open" -lt "$MAX_OPEN_PRS" ]; then has_slot=true; else has_slot=false; fi
          # Why each closed PR was declined: its maintainers' comments and reviews, and the closing
          # comment of the reviewer or github-actions[bot] (by REST, whose logins tell bots from
          # users). No one else's, as anyone can comment on a PR and this reaches the prompt.
          recent=$(jq -c '.[:30]' <<< "$prs")
          # shellcheck disable=SC2016 # jq's $closed and $bots
          for number in $(jq -r '.[] | select(.state == "CLOSED") | .number' <<< "$recent"); do
            why=$(gh pr view "$number" --json closedAt,comments,reviews > "$RUNNER_TEMP/pr.json" &&
              gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
                --jq '.[] | select(.user.type == "Bot" and (.user.login | IN("claude[bot]", "opencode-agent[bot]", "github-actions[bot]"))) | {body, createdAt: .created_at}' |
                jq -s . > "$RUNNER_TEMP/bots.json" &&
              jq -c --slurpfile bots "$RUNNER_TEMP/bots.json" '(.closedAt | fromdate) as $closed
                | [.comments[], .reviews[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))]
                  + [$bots[0][] | select((.createdAt | fromdate) >= $closed - 120)]
                | map(.body | gsub("\\s+"; " ") | .[:300] | select(. != ""))' "$RUNNER_TEMP/pr.json") ||
              { echo "::warning::Couldn't read why PR $number was closed."; why='[]'; }
            recent=$(jq -c --argjson n "$number" --argjson why "$why" 'map(if .number == $n then . + {why: $why} else . end)' <<< "$recent")
          done
          {
            echo "has-slot=$has_slot"
            echo "prs=$recent"
          } >> "$GITHUB_OUTPUT"

  improve:
    needs: capacity
    # !cancelled(): the implicit success() would also fail on any failed or skipped job further up.
    if: ${{ !cancelled() && needs.capacity.outputs.has-slot == 'true' }}
    runs-on: ${{ vars.RUNNER == 'github' && 'ubuntu-26.04' || 'ubicloud-standard-2-ubuntu-2604' }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      BRANCH: opencode/nightly-${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: auth
        uses: ./.github/actions/opencode
      - name: Set up toolchain and deps
        uses: ftes/ci/setup@0e4b067199ea2f6a255a26ab43403f6f6acb5cb6 # v1.0.12
      - name: Fetch Playwright source
        run: mix fluffy.playwright_source
      - run: git switch -c "$BRANCH"
      - name: Pick tonight's focus area
        id: focus
        # By day of the year, so successive nights look at different parts of the code.
        # Keep the paths in step with lib/.
        run: |
          areas=(
            "the Static and LiveView drivers and their form state: lib/fluffy/driver/static*, lib/fluffy/driver/live*, lib/fluffy/driver/no_document*, lib/fluffy/driver/phoenix/validation.ex, lib/fluffy/driver/phoenix/form.ex, lib/fluffy/selected_file.ex"
            "the Playwright driver and backend: lib/fluffy/driver/playwright*, lib/fluffy/backend/playwright*, lib/fluffy/playwright*, lib/fluffy/open_browser.ex"
            "HTML semantics, locators and actionability: lib/fluffy/driver/phoenix/html/, lib/fluffy/locator*, lib/fluffy/driver/phoenix/locator.ex, lib/fluffy/frame_locator.ex, lib/fluffy/driver/phoenix/client_dom*, lib/fluffy/driver/phoenix/actionability.ex"
            "the public API: lib/fluffy.ex, lib/fluffy/page*, lib/fluffy/expect*, lib/fluffy/assert.ex, lib/fluffy/options*, lib/fluffy/capability.ex, lib/fluffy/phoenix_test*, lib/fluffy/download.ex, lib/fluffy/file_chooser.ex, lib/fluffy/file_payload.ex and the lib/fluffy/*_error.ex modules"
            "sessions, backends and events: lib/fluffy/session*, lib/fluffy/backend.ex, lib/fluffy/backend/contract.ex, lib/fluffy/backend/registry.ex, lib/fluffy/backend/phoenix*, lib/fluffy/driver/contract.ex, lib/fluffy/driver/registry.ex, lib/fluffy/event*, lib/fluffy/sandbox.ex, lib/fluffy/internal/, lib/fluffy/application.ex"
            "timeouts and the test context: lib/fluffy/timeouts.ex, lib/fluffy/deadline.ex, lib/fluffy/test_timeout.ex, lib/fluffy/test_info.ex, and where the drivers take their timeouts"
            "test/ and its support code, without weakening what a test checks"
          )
          area=${areas[$((10#$(date -u +%j) % ${#areas[@]}))]}
          echo "::notice::Focus: $area"
          echo "area=$area" >> "$GITHUB_OUTPUT"

      - name: Improve and publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ steps.auth.outputs.token }}
          FOCUS: ${{ steps.focus.outputs.area }}
          PAST_PRS: ${{ needs.capacity.outputs.prs }}
        run: python3 .github/opencode/run.py improve
